name: Feature request
description: Suggest a focused improvement to Subtitle Renamer
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement. Explain the user problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would expect, including a filename example when relevant.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - Desktop
        - Core matching behavior
        - All interfaces
        - Documentation or packaging
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any current workaround or simpler alternative.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety contract
      options:
        - label: The proposal preserves source subtitle files and does not require overwriting existing targets.
          required: true
        - label: I searched existing issues for this request.
          required: true
