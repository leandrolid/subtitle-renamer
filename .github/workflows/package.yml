name: native-packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-windows-nsis:
    name: Package Windows x86_64 NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build unsigned NSIS bundle
        working-directory: crates/desktop
        run: cargo tauri build --ci --no-sign --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-renamer-windows-x86_64-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  smoke-windows-nsis:
    name: Smoke Windows x86_64 NSIS
    needs: package-windows-nsis
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subtitle-renamer-windows-x86_64-nsis
          path: bundle
      - name: Install, launch, assert, and terminate NSIS application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path bundle -Filter '*.exe' -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not downloaded' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $application = Get-ChildItem -Path $env:LOCALAPPDATA -Filter 'subtitle-renamer-desktop.exe' -Recurse | Select-Object -First 1
          if ($null -eq $application) { throw 'NSIS installer did not install subtitle-renamer-desktop.exe' }
          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 2
          if ($process.HasExited) { throw 'Installed application exited before smoke assertion' }
          Stop-Process -Id $process.Id

  package-linux:
    name: Package Linux x86_64 deb and AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build unsigned deb and AppImage bundles
        working-directory: crates/desktop
        run: cargo tauri build --ci --no-sign --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-renamer-linux-x86_64-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-renamer-linux-x86_64-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  smoke-linux-deb:
    name: Smoke Linux x86_64 deb
    needs: package-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subtitle-renamer-linux-x86_64-deb
          path: bundle
      - name: Install deb dependencies and prove the process stays live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 ./bundle/*.deb
          set +e
          xvfb-run -a timeout 10s subtitle-renamer-desktop
          status=$?
          set -e
          test "$status" -eq 124

  smoke-linux-appimage:
    name: Smoke Linux x86_64 AppImage
    needs: package-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subtitle-renamer-linux-x86_64-appimage
          path: bundle
      - name: Launch AppImage under Xvfb and prove the process stays live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
          appimage=$(find bundle -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 10s "$appimage"
          status=$?
          set -e
          test "$status" -eq 124
