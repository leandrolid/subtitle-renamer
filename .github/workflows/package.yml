name: native-packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - "main"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Self-test metadata script
        run: bash .github/scripts/release-metadata.sh --self-test
      - name: Extract and validate release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          CARGO_VERSION=$(python3 -c "
          import re, sys
          content = open('Cargo.toml').read()
          m = re.search(r'\[workspace\.package\].*?version\s*=\s*\"([^\"]+)\"', content, re.DOTALL)
          if not m: sys.exit(1)
          print(m.group(1))
          ")
          TAURI_VERSION=$(python3 -c "import json; d=json.load(open('crates/desktop/tauri.conf.json')); print(d['version'])")
          PKG_VERSION=$(python3 -c "import json; d=json.load(open('package.json')); print(d['version'])")
          LOCK_ROOT=$(python3 -c "import json; d=json.load(open('package-lock.json')); print(d['version'])")
          LOCK_PKG=$(python3 -c "import json; d=json.load(open('package-lock.json')); print(d['packages']['']['version'])")

          OUTPUT=$(bash .github/scripts/release-metadata.sh \
            "$EVENT_NAME" "$EVENT_REF_TYPE" "$EVENT_REF_NAME" "$EVENT_SHA" \
            "$CARGO_VERSION" "$TAURI_VERSION" "$PKG_VERSION" "$LOCK_ROOT" "$LOCK_PKG")

          echo "$OUTPUT" >> "$GITHUB_OUTPUT"

  package-windows-nsis:
    name: Package Windows x86_64 NSIS + CLI
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Assert HEAD matches prepare commit
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb5f0875af4d5e3e2b2422
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890bd2f3bd12f3510d
        with:
          workspaces: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build unsigned NSIS bundle
        working-directory: crates/desktop
        run: cargo tauri build --ci --no-sign --bundles nsis
      - name: Build CLI
        run: cargo build -p subtitle-renamer-cli --release --locked
      - name: Stage assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          mkdir -p dist
          # Exactly one NSIS exe
          nsis_files=( target/release/bundle/nsis/*.exe )
          if [[ ${#nsis_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 NSIS exe, found ${#nsis_files[@]}" >&2; exit 1
          fi
          cp "${nsis_files[0]}" "dist/subtitle-renamer-desktop-${TAG}-windows-x86_64-nsis.exe"
          cp target/release/subtitle-renamer.exe "dist/subtitle-renamer-cli-${TAG}-windows-x86_64.exe"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68cf7e19c4cf304b0638bd5
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-windows-x86_64
          path: dist/
          if-no-files-found: error

  package-linux:
    name: Package Linux x86_64 deb + AppImage + CLI
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Assert HEAD matches prepare commit
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb5f0875af4d5e3e2b2422
        with:
          toolchain: 1.97.1
      - name: Install Linux bundle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890bd2f3bd12f3510d
        with:
          workspaces: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build unsigned deb and AppImage bundles
        working-directory: crates/desktop
        run: cargo tauri build --ci --no-sign --bundles deb,appimage
      - name: Build CLI
        run: cargo build -p subtitle-renamer-cli --release --locked
      - name: Stage assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p dist
          # Exactly one deb
          deb_files=( target/release/bundle/deb/*.deb )
          if [[ ${#deb_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 deb, found ${#deb_files[@]}" >&2; exit 1
          fi
          cp "${deb_files[0]}" "dist/subtitle-renamer-desktop-${TAG}-linux-x86_64.deb"
          # Exactly one AppImage
          appimage_files=( target/release/bundle/appimage/*.AppImage )
          if [[ ${#appimage_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 AppImage, found ${#appimage_files[@]}" >&2; exit 1
          fi
          cp "${appimage_files[0]}" "dist/subtitle-renamer-desktop-${TAG}-linux-x86_64.AppImage"
          cp target/release/subtitle-renamer "dist/subtitle-renamer-cli-${TAG}-linux-x86_64"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68cf7e19c4cf304b0638bd5
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-linux-x86_64
          path: dist/
          if-no-files-found: error

  smoke-windows-nsis:
    name: Smoke Windows x86_64 NSIS
    needs: [prepare, package-windows-nsis]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-windows-x86_64
          path: bundle
      - name: Install, launch, assert, and terminate NSIS application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path bundle -Filter '*-nsis.exe' -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not downloaded' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $application = Get-ChildItem -Path $env:LOCALAPPDATA -Filter 'subtitle-renamer-desktop.exe' -Recurse | Select-Object -First 1
          if ($null -eq $application) { throw 'NSIS installer did not install subtitle-renamer-desktop.exe' }
          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 2
          if ($process.HasExited) { throw 'Installed application exited before smoke assertion' }
          Stop-Process -Id $process.Id

  smoke-windows-cli:
    name: Smoke Windows x86_64 CLI
    needs: [prepare, package-windows-nsis]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-windows-x86_64
          path: bundle
      - name: Assert --version output
        shell: pwsh
        run: |
          $cli = Get-ChildItem -Path bundle -Filter '*-windows-x86_64.exe' -Exclude '*-nsis.exe' | Select-Object -First 1
          if ($null -eq $cli) { throw 'CLI exe was not downloaded' }
          $result = & $cli.FullName --version 2>&1
          $stdout = $result | Out-String
          $stdout = $stdout.TrimEnd("`r", "`n")
          if ($stdout -notmatch '^subtitle-renamer \d+\.\d+\.\d+$') {
            throw "Unexpected --version output: '$stdout'"
          }
          Write-Host "CLI version: $stdout"

  smoke-linux-deb:
    name: Smoke Linux x86_64 deb
    needs: [prepare, package-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-linux-x86_64
          path: bundle
      - name: Install deb dependencies and prove the process stays live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 ./bundle/*.deb
          set +e
          xvfb-run -a timeout 10s subtitle-renamer-desktop
          status=$?
          set -e
          test "$status" -eq 124

  smoke-linux-appimage:
    name: Smoke Linux x86_64 AppImage
    needs: [prepare, package-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-linux-x86_64
          path: bundle
      - name: Launch AppImage under Xvfb and prove the process stays live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
          appimage=$(find bundle -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 10s "$appimage"
          status=$?
          set -e
          test "$status" -eq 124

  smoke-linux-cli:
    name: Smoke Linux x86_64 CLI
    needs: [prepare, package-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-linux-x86_64
          path: bundle
      - name: Assert --version output
        run: |
          cli=$(find bundle -name '*-linux-x86_64' -not -name '*.deb' -not -name '*.AppImage' -print -quit)
          test -n "$cli"
          chmod +x "$cli"
          actual_stdout=$("$cli" --version 2>/tmp/cli-stderr)
          actual_stderr=$(cat /tmp/cli-stderr)
          if [[ -n "$actual_stderr" ]]; then
            echo "Expected empty stderr, got: $actual_stderr" >&2; exit 1
          fi
          if [[ ! "$actual_stdout" =~ ^subtitle-renamer\ [0-9]+\.[0-9]+\.[0-9]+$'\n'?$ ]]; then
            echo "Unexpected --version output: '$actual_stdout'" >&2; exit 1
          fi
           echo "CLI version: $actual_stdout"

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      [
        prepare,
        smoke-windows-nsis,
        smoke-windows-cli,
        smoke-linux-deb,
        smoke-linux-appimage,
        smoke-linux-cli,
      ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Assert local HEAD and peeled tag match prepare commit
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
      - name: Verify remote tag before draft creation
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bash .github/scripts/prepare-release.sh verify-remote-tag origin "$TAG" "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-windows-x86_64
          path: dist/
      - uses: actions/download-artifact@cc65e827c83e2b0238dd9af5b1ceebca3e3e0cdd
        with:
          name: subtitle-renamer-${{ needs.prepare.outputs.tag }}-linux-x86_64
          path: dist/
      - name: Prepare release notes and checksums
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          bash .github/scripts/prepare-release.sh prepare "$TAG" "$GITHUB_REPOSITORY" dist/ release-notes.md
      - name: Check for existing release (paginated, fail-closed)
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          existing=$(python3 -c "
          import json, subprocess, sys
          result = subprocess.run(
            ['gh', 'api', '--paginate', '--slurp', f'repos/$GITHUB_REPOSITORY/releases?per_page=100'],
            capture_output=True, text=True, check=True
          )
          releases = json.loads(result.stdout)
          tag = '$TAG'
          for page in releases:
            for r in (page if isinstance(page, list) else [page]):
              if r.get('tag_name') == tag:
                print(f'Release already exists: tag={r[\"tag_name\"]} draft={r[\"draft\"]}')
                sys.exit(1)
          print('no-match')
          ")
          echo "$existing"
      - name: Assert local HEAD and peeled tag still match before creation
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
      - name: Create draft release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --target "$EXPECTED_COMMIT" \
            --title "Subtitle Renamer $TAG" \
            --notes-file release-notes.md
      - name: Upload release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "dist/subtitle-renamer-desktop-${TAG}-windows-x86_64-nsis.exe" \
            "dist/subtitle-renamer-desktop-${TAG}-linux-x86_64.deb" \
            "dist/subtitle-renamer-desktop-${TAG}-linux-x86_64.AppImage" \
            "dist/subtitle-renamer-cli-${TAG}-windows-x86_64.exe" \
            "dist/subtitle-renamer-cli-${TAG}-linux-x86_64" \
            "dist/checksums.txt"
      - name: Verify uploaded assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          expected_names=(
            "subtitle-renamer-desktop-${TAG}-windows-x86_64-nsis.exe"
            "subtitle-renamer-desktop-${TAG}-linux-x86_64.deb"
            "subtitle-renamer-desktop-${TAG}-linux-x86_64.AppImage"
            "subtitle-renamer-cli-${TAG}-windows-x86_64.exe"
            "subtitle-renamer-cli-${TAG}-linux-x86_64"
            "checksums.txt"
          )
          actual_names=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join("\n")')
          expected_sorted=$(printf '%s\n' "${expected_names[@]}" | sort)
          if [[ "$actual_names" != "$expected_sorted" ]]; then
            echo "Asset mismatch. Expected: $expected_sorted" >&2
            echo "Got: $actual_names" >&2
            exit 1
          fi
      - name: Verify remote tag before publication
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bash .github/scripts/prepare-release.sh verify-remote-tag origin "$TAG" "$EXPECTED_COMMIT"
      - name: Assert local HEAD and peeled tag still match before publication
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
