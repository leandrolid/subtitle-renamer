[package]
name = "subtitle-renamer-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "subtitle-renamer"

[[bin]]
name = "subtitle-renamer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
subtitle-renamer = { path = "..", default-features = false }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"

[dev-dependencies]
serde_json = "=1.0.149"
